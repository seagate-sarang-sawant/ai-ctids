name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8 mypy
          pip install -r shared/requirements.txt || true
      
      - name: Lint with flake8
        run: |
          flake8 shared/ batch-trainer/ inference-api/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 shared/ batch-trainer/ inference-api/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Type check with mypy
        run: |
          mypy shared/ --ignore-missing-imports || true
      
      - name: Run tests
        run: |
          pytest tests/ --cov=. --cov-report=xml --cov-report=html || true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
